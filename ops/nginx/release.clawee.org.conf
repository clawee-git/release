# release.clawee.org — public install channel (service + static)
#
# TWO surfaces on one vhost, and the split is the point:
#
#   PAGES    proxied to clawee-release-manage. /, /downloads, /verify,
#            /platforms, /docs and the operator's /manage + /api are rendered
#            from the catalog, so the version a visitor reads and the version
#            an installer resolves cannot disagree.
#   STATIC   files under STATIC_DIR, put there by `clawee-release-manage
#            publish-static` when the KIT changes (not per cut):
#            clawee-release.pub, <comp>/install.sh, <comp>/upgrade.sh,
#            <comp>/beta.install.sh, <comp>/beta.upgrade.sh, <comp>/version.js
#            and <comp>/beta.version.js.
#
# The bootstraps stay static ON PURPOSE. They are the trust anchor delivered as
# `curl … | sh`, they embed no version, and a static file cannot be affected by
# whether the service is up.
#
# Host: nsm.renative.com (also fronts console / umbree / burree / the burrowee
# release channel). Behind Cloudflare in Full (strict) mode — origin presents a
# real cert, CF connects over TLS and validates it. See ops/README.md for
# operator activation.
#
# DEPLOY LOCATION (nsm specifics — see ops/README.md):
#   This host's nginx.conf includes ONLY /etc/nginx/sites-enabled/* — it does
#   NOT include /etc/nginx/conf.d/*.conf. Drop this file into
#   /etc/nginx/sites-enabled/ (the .conf extension is fine there). A copy under
#   conf.d/ is SILENTLY IGNORED.
#   This host's nginx build also rejects TLSv1.3 — keep ssl_protocols at TLSv1.2.
#   Do NOT mark this server default_server: another sites-enabled file already
#   owns default_server on :443.

server {
    listen 80;
    listen [::]:80;
    server_name release.clawee.org;

    # Cloudflare handles the public redirect; this is a belt-and-suspenders
    # bounce for any direct-to-origin http hit.
    return 301 https://release.clawee.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name release.clawee.org;

    # === TLS — OPERATOR PLACEHOLDERS ===========================================
    # Issue/point these at the host cert for release.clawee.org, then reload.
    # (Mirror the console / release.burrowee.com vhosts on this host.) On nsm,
    # ONLY TLSv1.2 is accepted.
    ssl_certificate     /etc/letsencrypt/live/release.clawee.org/fullchain.pem;  # OPERATOR: set real path
    ssl_certificate_key /etc/letsencrypt/live/release.clawee.org/privkey.pem;    # OPERATOR: set real path
    ssl_protocols       TLSv1.2;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    # ===========================================================================

    # Static root — must match the --static-dir publish-static is run with.
    root  /ebs_storage/apps/release.clawee.org/static;

    server_tokens off;
    charset utf-8;

    # The pages. Everything not matched by a static location below is the
    # service's, INCLUDING "/" — there is no index.html any more, and a
    # try_files fallback here would answer 404 for the site's own front page.
    #
    # OPERATOR: --listen defaults to loopback; keep the two in step.
    location / {
        proxy_pass         http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Promote streams NDJSON progress for the whole publish — several
        # hundred megabytes of copying. Buffering it would hand the operator
        # the entire log at the end, which is exactly the "is it hung?"
        # ambiguity the stream exists to remove, and a read timeout would cut
        # a healthy promote off mid-copy.
        proxy_buffering    off;
        proxy_read_timeout 1h;
    }

    # Bootstrap installers: served as a shell script so `curl … | sh` is honest
    # about the content type, and never cached stale at the edge for long.
    location ~ \.sh$ {
        default_type  text/x-shellscript;
        add_header    Cache-Control "public, max-age=300";
        try_files     $uri =404;
    }

    # Version JSONP (<comp>/version.js) — consumed cross-origin by clawee.org via
    # a plain <script src> to render the live version badge. Short cache so the
    # badge tracks a fresh release; JSONP means no CORS headers are needed.
    location ~ \.js$ {
        default_type  application/javascript;
        add_header    Cache-Control "public, max-age=300";
        try_files     $uri =404;
    }

    # The signing public key — plain text, the trust anchor for manual verify.
    location = /clawee-release.pub {
        default_type  text/plain;
        add_header    Cache-Control "public, max-age=300";
    }

    # SHA256SUMS / signatures if ever served from the static surface — plain text.
    location ~ \.(txt|minisig)$ {
        default_type  text/plain;
        try_files     $uri =404;
    }
}
