{{define "publiclayout"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} — clawee</title>
<meta name="description" content="Public, signed, self-service install channel for the Clawee terminal client and PTY daemon. Every download is verified end-to-end.">
<style>
  /* Ported verbatim from the static site/index.html this surface replaced.
     The rebuild is a PORT, not a redesign: the palette, the wordmark and the
     install-line treatment are the brand, and a page that renders the same
     bytes from the catalog should not also look like a different product. */
  :root {
    --bg:     #14161A; /* page canvas — slate near-black */
    --well:   #0E1013; /* recessed: code blocks, wells */
    --text:   #E4E7EB; /* primary text — soft white, never #fff */
    --mark:   #F6A93B; /* MARK ONLY — wordmark accent (warm amber) */
    --accent: #D98E2B; /* UI accent — links, buttons, focus */

    --text-muted:  rgba(228, 231, 235, 0.55);
    --text-faint:  rgba(228, 231, 235, 0.30);
    --line:        rgba(228, 231, 235, 0.10);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .wrap { max-width: 760px; margin: 0 auto; padding: 64px 24px 96px; }

  /* wordmark */
  .brand {
    font: 600 44px/1 "Bricolage Grotesque", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    letter-spacing: -0.025em;
    color: var(--text);
    margin: 0;
  }
  .brand a { color: inherit; }
  .brand a:hover { text-decoration: none; }
  .brand .ee { color: var(--mark); text-shadow: 0 0 24px rgba(246, 169, 59, 0.35); }

  .tagline { color: var(--text-muted); margin: 12px 0 0; font-size: 17px; }

  nav.site { margin: 28px 0 0; display: flex; flex-wrap: wrap; gap: 18px; }
  nav.site a { font-size: 14px; letter-spacing: 0.03em; text-transform: uppercase; color: var(--text-muted); }
  nav.site a[aria-current="page"] { color: var(--mark); }

  h2 {
    font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-muted); margin: 56px 0 16px;
  }
  h3 { font-size: 16px; font-weight: 600; margin: 28px 0 8px; }

  p { margin: 0 0 14px; }
  .muted { color: var(--text-muted); }
  .faint { color: var(--text-faint); }

  /* install lines */
  .install {
    display: block; background: var(--well); border: 1px solid var(--line);
    border-radius: 8px; padding: 14px 16px; margin: 0 0 12px; overflow-x: auto;
  }
  .install .label {
    display: block; color: var(--accent);
    font: 600 12px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px;
  }
  code, pre, kbd {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 14px;
  }
  .install code { color: var(--text); white-space: pre; }

  /* The copy button is progressive enhancement: with no JS the command is
     still selectable text, which is how it was copied before this page had a
     button at all. */
  button.copy {
    float: right; margin-left: 12px; background: none; cursor: pointer;
    border: 1px solid var(--line); border-radius: 6px; color: var(--text-muted);
    font: 600 11px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    letter-spacing: 0.06em; text-transform: uppercase; padding: 5px 9px;
  }
  button.copy:hover { color: var(--accent); border-color: var(--accent); }

  pre.block {
    background: var(--well); border: 1px solid var(--line); border-radius: 8px;
    padding: 16px; margin: 0 0 14px; overflow-x: auto; color: var(--text);
  }

  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; margin: 4px 0 8px; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 15px; }
  th { color: var(--text-muted); font-weight: 600; }
  td.yes { color: var(--accent); }
  td.stamp { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  tr.expired td { color: var(--text-faint); }

  ul.links { list-style: none; padding: 0; margin: 0 0 14px; }
  ul.links li { padding: 6px 0; border-bottom: 1px solid var(--line); }
  ul.links .what { color: var(--text-muted); font-size: 14px; }

  .pill {
    display: inline-block; border: 1px solid var(--line); border-radius: 999px;
    padding: 2px 10px; font-size: 12px; color: var(--text-muted);
    margin-left: 8px; vertical-align: middle;
  }
  .badge {
    display: inline-block; border: 1px solid var(--line); border-radius: 999px;
    padding: 2px 10px; font-size: 12px; color: var(--text-muted); margin: 0 8px 8px 0;
  }
  .badge b { color: var(--text); font-weight: 600; }
  .badge.beta b { color: var(--mark); }
  .yanked { color: var(--mark); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }

  footer {
    margin-top: 72px; padding-top: 24px; border-top: 1px solid var(--line);
    color: var(--text-faint); font-size: 13px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1 class="brand"><a href="/">claw<span class="ee">ee</span></a></h1>
    <p class="tagline">The signed, self-service install channel for the Clawee terminal client.</p>
    <nav class="site">
      {{range .Nav}}<a href="{{.Path}}"{{if .Current}} aria-current="page"{{end}}>{{.Label}}</a>{{end}}
    </nav>
  </header>

{{template "content" .}}

  <footer>
    Preview release. Public signing key:
    <a href="/{{.PubkeyFile}}">{{.PubkeyFile}}</a>.
    <span class="pill">macOS + Linux · arm64 + amd64</span>
  </footer>

</div>
<script>
// One delegated listener, not one per button: the pages render a variable
// number of install lines and a listener per node is a listener to forget.
document.addEventListener('click', function (ev) {
  var btn = ev.target.closest('button.copy');
  if (!btn || !navigator.clipboard) return;
  var line = btn.parentElement.querySelector('code');
  if (!line) return;
  navigator.clipboard.writeText(line.textContent).then(function () {
    var was = btn.textContent;
    btn.textContent = 'copied';
    setTimeout(function () { btn.textContent = was; }, 1200);
  });
});
</script>
</body>
</html>{{end}}
